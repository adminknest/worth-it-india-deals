name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile dealbot.py earnkaro_intake.py operator_bot.py cuelinks_client.py
      - name: Test
        run: python -m unittest -v test_dealbot.py test_earnkaro_intake.py test_operator_bot.py test_cuelinks_client.py
      - name: Ensure secrets are not committed
        run: |
          tracked="$(git ls-files 'config.json' '.env' '.env.*' 'data/**')"
          if [ -n "$tracked" ]; then
            echo "Sensitive runtime paths are tracked:"
            echo "$tracked"
            exit 1
          fi
